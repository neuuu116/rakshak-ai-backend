<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Rakshak AI - Scam Detector</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">

<header class="fixed top-0 left-0 w-full z-50 flex items-center px-4 h-16 bg-surface/70 backdrop-blur-xl border-b border-white/10">
  <div class="flex items-center gap-2">
    <span class="material-symbols-outlined text-primary">shield_lock</span>
    <h1 class="text-2xl font-bold text-primary">Rakshak AI</h1>
  </div>
</header>

<main class="flex-grow pt-24 pb-32 px-4 max-w-lg mx-auto w-full">

  <section class="text-center mb-8">
    <h2 class="text-4xl font-bold mb-2">AI Guardian</h2>
    <p class="text-on-surface-variant">Detect scams before they strike.</p>
  </section>

  <div class="relative mb-6">
    <div class="scanning-line z-10" id="scanningLine"></div>

    <textarea
      class="w-full h-48 glass-card rounded-xl p-4 text-on-surface placeholder:text-outline outline-none resize-none"
      id="message"
      placeholder="Paste suspicious message, SMS, or email here..."
    ></textarea>
  </div>

  <button
    class="w-full py-4 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center gap-2 glow-button mb-10"
    onclick="detectScam()"
  >
    <span class="material-symbols-outlined">radar</span>
    Scan Message
  </button>

  <div class="hidden glass-card rounded-xl p-6 relative overflow-hidden" id="result"></div>

</main>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-4 bg-surface-container/80 backdrop-blur-lg border-t border-white/10">
  <a class="flex flex-col items-center text-secondary" href="#">
    <span class="material-symbols-outlined">radar</span>
    <span>Scan</span>
  </a>
  <a class="flex flex-col items-center text-on-surface-variant" href="#">
    <span class="material-symbols-outlined">history</span>
    <span>History</span>
  </a>
  <a class="flex flex-col items-center text-on-surface-variant" href="#">
    <span class="material-symbols-outlined">verified_user</span>
    <span>Security</span>
  </a>
</nav>

<script src="script.js"></script>
</body>
</html>
